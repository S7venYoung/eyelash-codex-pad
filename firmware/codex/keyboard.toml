[keyboard]
name = "eyelash-numpad"
product_name = "eyelash-numpad"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52832"
usb_enable = false

[matrix]
# Row and col pins are mandatory
row_pins = ["P0_27", "P0_28", "P0_03", "P0_04"]
col_pins = ["P0_05", "P0_07", "P0_09", "P0_25"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 4
cols = 4
layers = 2
matrix_map = """
(0, 0) (0, 1) (0, 2) (0, 3)
(1, 0) (1, 1) (1, 2) (1, 3)
(2, 0) (2, 1) (2, 2) (2, 3)
(3, 0) (3, 1) (3, 2) (3, 3)
"""

[[layer]]
name = "default"
keys = """
Kp7 Kp8 Kp9 KpSlash
Kp4 Kp5 Kp6 KpAsterisk
Kp1 Kp2 Kp3 KpMinus
LT(1, KpEnter) Kp0 KpDot KpPlus
"""

[[layer]]
name = "layer2"
keys = """
_ _ _ _
_ _ _ _
_ _ _ _
_ _ _ _
"""

[storage]
# Moved from the nrf52832 default 0x60000 to leave more room for the app.
# 0x70000 + 16 * 4K sectors ends exactly at the 512K flash top.
start_addr = 0x70000
num_sectors = 16

[ble]
enabled = true
battery_adc_pin = "P0_02"
adc_divider_measured = 2000
adc_divider_total = 2806

[dependency]
# defmt is disabled: the macro emits an empty defmt logger instead of defmt-rtt
defmt_log = false

[rmk]
fork_max_num = 0
macro_space_size = 128
report_channel_size = 4
flash_channel_size = 1
split_peripherals_num = 0
split_central_sleep_timeout_seconds = 7200
